<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: search engines and link previews read these directly from this file,
         so this text is the one exception to "all content lives in data.ts".
         Replace every [bracket] placeholder before deploying. -->
    <title>[Your Name] — Software Engineer</title>
    <meta
      name="description"
      content="Software Engineer building full-stack web applications with React, TypeScript and Node.js. Open to job opportunities and relocation to Germany."
    />
    <meta name="author" content="[Your Name]" />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: the preview card shown when the link is shared (LinkedIn, WhatsApp, ...).
         og:url and og:image must be full URLs, including https:// -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[Your Name] — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack web applications with React, TypeScript and Node.js. Open to job opportunities and relocation to Germany."
    />
    <meta property="og:url" content="[https://your-site-url]" />
    <meta property="og:image" content="[https://your-site-url]/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
